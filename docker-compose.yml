# Entorno de desarrollo: PostgreSQL + Django.
# Uso: docker compose up        (Ctrl+C para detener)
# Las variables ${...} se leen del archivo .env de esta misma carpeta.
name: quien-toca

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      # Volumen con nombre: los datos sobreviven aunque se borre el contenedor.
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      # "Sano" = PostgreSQL ya acepta conexiones. $$ evita que Compose lo interprete.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      # "db" es el nombre del servicio de arriba: Compose lo resuelve como un host.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # Monta el código: los cambios se ven sin reconstruir la imagen.
      - ./backend:/app
    ports:
      # puerto_de_tu_equipo:puerto_del_contenedor. Si el 8000 está ocupado,
      # define PUERTO_BACKEND=8001 (u otro) en .env.
      - "${PUERTO_BACKEND:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    # Sin Dockerfile propio: la imagen oficial de Node basta para el servidor de desarrollo.
    image: node:24-alpine
    working_dir: /app
    # npm install al arrancar: rápido cuando ya está todo, y no se olvida tras cambiar package.json.
    command: sh -c "npm install && npm run dev"
    environment:
      # Vite reenvía /api a este destino. "backend" es el nombre del servicio de arriba.
      API_PROXY_DESTINO: http://backend:8000
    volumes:
      - ./frontend:/app
      # node_modules vive en un volumen de Docker, no en tu carpeta de Windows:
      # algunos paquetes traen partes compiladas para Linux y no deben mezclarse.
      - node_modules_frontend:/app/node_modules
    ports:
      - "${PUERTO_FRONTEND:-5173}:5173"
    depends_on:
      - backend

volumes:
  datos_postgres:
  node_modules_frontend:
